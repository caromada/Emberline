name: tests
on:
  push:
    branches: [main]
    paths: ["pipeline/**"]
  pull_request:
    paths: ["pipeline/**"]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r pipeline/requirements.txt
      - run: pytest -q
        working-directory: pipeline

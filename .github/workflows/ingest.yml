name: ingest
on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    if: ${{ vars.INGEST_ENABLED != 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r pipeline/requirements.txt
      - name: Run ingest
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          cd pipeline
          python -m emberline.run --data-dir ../data --day-range 5
          python scripts/validate_nifc.py --data-dir ../data || true
          python -c "from emberline.db import sync; sync('../data')"
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: ingest $(date -u +'%Y-%m-%dT%H:%MZ')"
          git push
